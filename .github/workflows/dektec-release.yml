# Builds a release of DekTec's FFmpeg from a tag such as n9.0.2-dektec1: ffmpeg, ffprobe
# and ffplay for Linux and Windows x64, LGPL, each tested with FATE's sdi and dektec tests
# first. CDTAPI comes with its NMOS bridge, and dtnmos with libcurl and civetweb, from the
# newest versions in DekTec's vcpkg registry, linked in statically; each package holds the
# licences of what is linked in. The release holds both packages, the source at the tag,
# which the LGPL asks for, and their SHA-256 sums. Run by hand, it makes a draft release
# of the tag given, to try the workflow.

name: Release

on:
  push:
    tags: ["n*-dektec*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, as a draft release"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CONFIGURE: --disable-autodetect --enable-sdl2 --disable-doc --enable-libcdtapi-nmos

jobs:
  linux:
    # The oldest runner, for the oldest glibc the binaries run with.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config libsdl2-dev

      - name: Build CDTAPI with its NMOS bridge, from DekTec's vcpkg registry
        run: |
          git clone -q --depth 1 https://github.com/dektec-com/dektec-vcpkg-registry.git "$RUNNER_TEMP/registry"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "cdtapi[nmos]:x64-linux" \
              --overlay-ports="$RUNNER_TEMP/registry/ports"
          pc="$VCPKG_INSTALLATION_ROOT/installed/x64-linux/lib/pkgconfig"
          echo "CDTAPI_TAG=v$(PKG_CONFIG_PATH="$pc" pkg-config --modversion cdtapi)" >> "$GITHUB_ENV"

      - name: Build FFmpeg, run FATE's tests and install
        run: |
          sh tools/dektec/build.sh --vcpkg "$VCPKG_INSTALLATION_ROOT" --triplet x64-linux --fate \
             --install --prefix "$RUNNER_TEMP/stage" -- $CONFIGURE

      - name: Package
        run: |
          name=ffmpeg-dektec-$TAG-linux64
          mkdir -p "$name/bin"
          cp "$RUNNER_TEMP"/stage/bin/ffmpeg "$RUNNER_TEMP"/stage/bin/ffprobe "$RUNNER_TEMP"/stage/bin/ffplay "$name/bin/"
          sh tools/dektec/release-readme.sh "$TAG" "$CDTAPI_TAG" "$name/bin/ffmpeg" > "$name/README.txt"
          cp LICENSE.md COPYING.LGPLv2.1 "$name/"
          sh tools/dektec/release-licenses.sh "$VCPKG_INSTALLATION_ROOT/installed/x64-linux" "$name/licenses"
          tar -cJf "$name.tar.xz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux64
          path: ffmpeg-dektec-*-linux64.tar.xz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make diffutils pkgconf nasm
          path-type: inherit

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build CDTAPI with its NMOS bridge, and SDL2, static with the static C runtime
        shell: pwsh
        run: |
          git clone -q --depth 1 https://github.com/dektec-com/dektec-vcpkg-registry.git "$env:RUNNER_TEMP\registry"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "cdtapi[nmos]:x64-windows-static" `
              sdl2:x64-windows-static --overlay-ports="$env:RUNNER_TEMP\registry\ports"
          $pc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib\pkgconfig"
          $version = ((Select-String -Path "$pc\cdtapi.pc" -Pattern '^Version:').Line -split ' ')[-1]
          "CDTAPI_TAG=v$version" >> $env:GITHUB_ENV

      - name: Build FFmpeg, run FATE's tests and install
        shell: msys2 {0}
        run: |
          # MSVC's link.exe before MSYS2's, which is another program.
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          sh tools/dektec/build.sh --vcpkg "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")" \
             --triplet x64-windows-static --crt mt --fate --install \
             --prefix "$(cygpath -u "$RUNNER_TEMP")/stage" -- $CONFIGURE

      - name: Package
        shell: msys2 {0}
        run: |
          stage=$(cygpath -u "$RUNNER_TEMP")/stage
          name=ffmpeg-dektec-$TAG-win64
          mkdir -p "$name/bin"
          cp "$stage/bin/ffmpeg.exe" "$stage/bin/ffprobe.exe" "$stage/bin/ffplay.exe" "$name/bin/"
          sh tools/dektec/release-readme.sh "$TAG" "$CDTAPI_TAG" "$name/bin/ffmpeg.exe" > "$name/README.txt"
          cp LICENSE.md COPYING.LGPLv2.1 "$name/"
          sh tools/dektec/release-licenses.sh \
             "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static" "$name/licenses"
          pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"

      - uses: actions/upload-artifact@v7
        with:
          name: win64
          path: ffmpeg-dektec-*-win64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: The source at the tag
        run: |
          git archive --format=tar --prefix="ffmpeg-dektec-$TAG/" "$TAG" | xz -9 > "ffmpeg-dektec-$TAG-source.tar.xz"
          sha256sum ffmpeg-dektec-$TAG-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && '--draft' || '' }}
        run: |
          base=${TAG%%-dektec*}
          notes="DekTec's FFmpeg $TAG: FFmpeg $base with the dektec input and output device and the sdi format, on CDTAPI, with NMOS.

          ffmpeg, ffprobe and ffplay for Linux and Windows x64, LGPL. The DekTec driver is installed separately; see https://www.dektec.com/downloads/SDK/. The source these are built from is the -source.tar.xz beside them."
          gh release create "$TAG" $DRAFT --verify-tag --title "$TAG" --notes "$notes" \
             ffmpeg-dektec-$TAG-* SHA256SUMS
